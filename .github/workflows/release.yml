name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: osu-beatmap-preview-linux-amd64
            package: osu-beatmap-preview
            binary: osu-beatmap-preview
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: osu-beatmap-preview-windows-amd64.exe
            package: osu-beatmap-preview
            binary: osu-beatmap-preview.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: osu-beatmap-preview-macos-amd64
            package: osu-beatmap-preview
            binary: osu-beatmap-preview
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: osu-beatmap-preview-macos-arm64
            package: osu-beatmap-preview
            binary: osu-beatmap-preview
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: osu-beatmap-preview-wgpu-linux-amd64
            package: osu-beatmap-preview-wgpu
            binary: osu-beatmap-preview-wgpu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: osu-beatmap-preview-wgpu-windows-amd64.exe
            package: osu-beatmap-preview-wgpu
            binary: osu-beatmap-preview-wgpu.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: osu-beatmap-preview-wgpu-macos-amd64
            package: osu-beatmap-preview-wgpu
            binary: osu-beatmap-preview-wgpu
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: osu-beatmap-preview-wgpu-macos-arm64
            package: osu-beatmap-preview-wgpu
            binary: osu-beatmap-preview-wgpu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --package ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract release notes from changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { sub(/\r$/, ""); print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md does not contain a section for version $version"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: artifacts/**/*
