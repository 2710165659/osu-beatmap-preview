# core 与 cli 共享的默认配置。
# 被 osu-beatmap-preview-core 与 osu-beatmap-preview-cli 使用。
# 默认配置文件
# 通用约定：sizing 中的数字使用逻辑像素并受 SCALE 影响；structure 和 style 不缩放。
# 名称含 _MS 的时长以毫秒为单位；颜色为 [R, G, B, A]，通道范围为 0～255。
# 四模式渲染配置
# 固定排版、颜色与时间标签外观由各模式常量定义，回放 HUD 独立布局。
render:
  standard:
    png:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      structure:
        ROW_COUNT: 5 # 行数
        IMAGES_PER_ROW: 8 # 每行图片数
      style:
        SHOW_CURSOR: false # 是否显示自动光标
        MS_PER_IMAGE: 400 # 同一行相邻图片之间的时间间隔，单位毫秒
        SLIDER_BODY_SUPERSAMPLE: 2 # 滑条本体的超采样倍数，越大越平滑但渲染越慢
    gif:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      structure:
        ROW_COUNT: 2 # 动画画面的网格行数
        IMAGES_PER_ROW: 2 # 动画画面每行包含的游玩区域数
      style:
        SHOW_CURSOR: false # 是否显示自动光标
        DURATION_MS: 5000 # 每个游玩区域覆盖的谱面时长
        FPS: 15 # GIF 帧率
        SLIDER_BODY_SUPERSAMPLE: 2 # 滑条本体的超采样倍数
    mp4:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      style:
        SHOW_CURSOR: false # 是否显示自动光标
        FPS: 15 # MP4 帧率
        ENABLE_BACKGROUND_IMAGE: true # 是否启用谱面背景图
        ENABLE_BACKGROUND_VIDEO: false # 是否启用谱面背景视频
        ENABLE_STORYBOARD: false # 是否启用故事板
        BACKGROUND_DIM: 0.7 # 背景与故事板暗化程度（0～1）
        ENABLE_HITSOUND: true # 是否启用打击音
        ENABLE_BEATMAP_HITSOUND: true # 是否使用谱面自带的打击音
        HITSOUND_VOLUME: 100 # 打击音音量（0～100，100 对应 osu! 默认音效音量）
  taiko:
    png:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      sizing:
        BASE_ROW_WIDTH_0_TO_1_MINUTES: 2600 # 0～1 分钟谱面使用的基础行宽
        BASE_ROW_WIDTH_1_TO_2_MINUTES: 3200 # 1～2 分钟谱面使用的基础行宽
        BASE_ROW_WIDTH_2_TO_3_MINUTES: 3800 # 2～3 分钟谱面使用的基础行宽
        BASE_ROW_WIDTH_3_TO_4_MINUTES: 4400 # 3～4 分钟谱面使用的基础行宽
        BASE_ROW_WIDTH_4_TO_5_MINUTES: 5000 # 4～5 分钟谱面使用的基础行宽
        BASE_ROW_WIDTH_5_TO_6_MINUTES: 5600 # 5～6 分钟谱面使用的基础行宽
        BASE_ROW_WIDTH_6_TO_10_MINUTES: 6400 # 6～10 分钟谱面使用的基础行宽
      style:
        MAX_SUPPORTED_DURATION_MS: 600000 # 支持的谱面最大时长
        ROW_WIDTH_MULTIPLIER_BPM_0_TO_180: 1.0 # BPM 0～180 时的行宽倍率
        ROW_WIDTH_MULTIPLIER_BPM_180_TO_240: 1.15 # BPM 180～240 时的行宽倍率
        ROW_WIDTH_MULTIPLIER_BPM_240_TO_300: 1.3 # BPM 240～300 时的行宽倍率
        ROW_WIDTH_MULTIPLIER_BPM_300_PLUS: 1.45 # BPM 300 以上时的行宽倍率
        SPACING_PER_BPM: 0.0 # 按 BPM 额外增加的水平间距，0 表示禁用
        TIME_LABEL_MIN_INTERVAL_MS: 2000 # 时间标签的最小时间间隔
    gif:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      structure:
        ROW_COUNT: 2 # 动画画面的网格行数
        IMAGES_PER_ROW: 2 # 动画画面每行包含的游玩区域数
      style:
        SHOW_HIT_EFFECTS: true # 是否显示 Note 击飞效果
        SHOW_KEY_OVERLAY: true # 是否显示击打按键
        SHOW_MEASURE_LINES: true # 是否绘制随谱面滚动的小节线
        DURATION_MS: 5000.0 # 每个动画片段覆盖的谱面时长
        FPS: 15.0 # GIF 帧率
    mp4:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      style:
        ENABLE_BACKGROUND_IMAGE: true # 是否启用谱面背景图
        ENABLE_BACKGROUND_VIDEO: false # 是否启用谱面背景视频
        ENABLE_STORYBOARD: false # 是否启用故事板
        BACKGROUND_DIM: 0.7 # 背景与故事板暗化程度（0～1）
        SHOW_HIT_EFFECTS: true # 是否显示 Note 击飞效果
        SHOW_KEY_OVERLAY: true # 是否显示击打按键
        SHOW_MEASURE_LINES: true # 是否绘制随谱面滚动的小节线
        FPS: 15.0 # MP4 帧率
        ENABLE_HITSOUND: true # 是否启用打击音
        ENABLE_BEATMAP_HITSOUND: true # 是否使用谱面自带的打击音
        HITSOUND_VOLUME: 100 # 打击音音量（0～100，100 对应 osu! 默认音效音量）
  catch:
    png:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      sizing:
        MAX_AREA_HEIGHT_0_TO_1_MINUTES: 3000 # 0～1 分钟谱面的单列最大高度
        MAX_AREA_HEIGHT_1_TO_2_MINUTES: 4125 # 1～2 分钟谱面的单列最大高度
        MAX_AREA_HEIGHT_2_TO_3_MINUTES: 5250 # 2～3 分钟谱面的单列最大高度
        MAX_AREA_HEIGHT_3_TO_4_MINUTES: 6375 # 3～4 分钟谱面的单列最大高度
        MAX_AREA_HEIGHT_4_TO_5_MINUTES: 7500 # 4～5 分钟谱面的单列最大高度
        MAX_AREA_HEIGHT_5_TO_6_MINUTES: 8625 # 5～6 分钟谱面的单列最大高度
        MAX_TOTAL_CHART_HEIGHT: 180000 # 整张 Catch 图表允许的最大高度
      style:
        SHOW_BANANA_ROUTE: true # 是否计算并绘制香蕉雨推荐路线
        MAX_SUPPORTED_DURATION_MS: 600000 # 支持的谱面最大时长
        TIME_LABEL_MIN_INTERVAL_MS: 2000 # 时间标签的最小时间间隔
    gif:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      structure:
        ROW_COUNT: 2 # 动画画面的网格行数
        IMAGES_PER_ROW: 2 # 动画画面每行包含的游玩区域数
      style:
        SHOW_CATCHER: false # 是否显示自动接盘
        DURATION_MS: 5000.0 # 每个动画片段覆盖的谱面时长
        FPS: 15.0 # GIF 帧率
    mp4:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      style:
        SHOW_CATCHER: false # 是否显示自动接盘
        ENABLE_BACKGROUND_IMAGE: true # 是否启用谱面背景图
        ENABLE_BACKGROUND_VIDEO: false # 是否启用谱面背景视频
        ENABLE_STORYBOARD: false # 是否启用故事板
        BACKGROUND_DIM: 0.7 # 背景与故事板暗化程度（0～1）
        FPS: 15.0 # MP4 帧率
        ENABLE_HITSOUND: true # 是否启用打击音
        ENABLE_BEATMAP_HITSOUND: true # 是否使用谱面自带的打击音
        HITSOUND_VOLUME: 100 # 打击音音量（0～100，100 对应 osu! 默认音效音量）
  mania:
    png:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      structure:
        FIXED_COLUMN_COUNT_6_TO_10_MINUTES: 30 # 6～10 分钟谱面固定使用的列数
      sizing:
        PIXELS_PER_MS: 0.4 # 时间轴缩放：每毫秒对应的像素数
        MAX_AREA_HEIGHT_0_TO_1_MINUTES: 3000 # 0～1 分钟谱面的单列最大高度
        MAX_AREA_HEIGHT_1_TO_2_MINUTES: 5000 # 1～2 分钟谱面的单列最大高度
        MAX_AREA_HEIGHT_2_TO_3_MINUTES: 7000 # 2～3 分钟谱面的单列最大高度
        MAX_AREA_HEIGHT_3_TO_4_MINUTES: 8500 # 3～4 分钟谱面的单列最大高度
        MAX_AREA_HEIGHT_4_TO_5_MINUTES: 10000 # 4～5 分钟谱面的单列最大高度
        MAX_AREA_HEIGHT_5_TO_6_MINUTES: 11500 # 5～6 分钟谱面的单列最大高度
      style:
        SHOW_SV_LABEL: true # 是否显示 SV 标签
        TIME_LABEL_MIN_INTERVAL_MS: 2000 # 时间标签的最小时间间隔
        MAX_SUPPORTED_DURATION_MS: 600000 # 支持的谱面最大时长
        BOTTOM_PADDING_MS: 2000 # 图表底部额外留白时长
    gif:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      structure:
        IMAGES_PER_ROW: 4 # 动画画面每行包含的游玩区域数
      style:
        DURATION_MS: 10000 # 每个动画片段覆盖的谱面时长
        FPS: 15 # GIF 帧率
        SCROLL_SPEED: 33.0 # 滚动速度基准值，越大则画面内可见的时间范围越短
        SHOW_SV_LABEL: true # 是否显示 SV 标签
        SHOW_HIT_FLASH: true # 音符到达判定线时是否显示对应轨道的击打闪光
    mp4:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      style:
        ENABLE_BACKGROUND_IMAGE: true # 是否启用谱面背景图
        ENABLE_BACKGROUND_VIDEO: false # 是否启用谱面背景视频
        ENABLE_STORYBOARD: false # 是否启用故事板
        BACKGROUND_DIM: 0.7 # 背景与故事板暗化程度（0～1）
        FPS: 15 # MP4 帧率
        SHOW_SV_LABEL: false # 是否显示 SV 标签
        SHOW_HIT_FLASH: true # 音符到达判定线时是否显示对应轨道的击打闪光（含实时预览）
        LANE_DARKEN_ALPHA: 1.0 # MP4 轨道黑色暗化层透明度（0..1）
        ENABLE_HITSOUND: true # 是否启用打击音
        ENABLE_BEATMAP_HITSOUND: true # 是否使用谱面自带的打击音
        HITSOUND_VOLUME: 100 # 打击音音量（0～100，100 对应 osu! 默认音效音量）
skin:
  # 皮肤颜色均为 RGB/RGBA；MANIA 下的 KEYS_N 为对应键数的列布局。
  COMBO_COLORS: [[150, 230, 255], [255, 125, 177], [130, 255, 160]] # Standard 连击颜色，按顺序循环
  HIT_CIRCLE_OVERLAP: 10 # Standard 圆圈重叠像素数
  HYPER_DASH: [255, 0, 0] # Hyper dash 外圈颜色（RGB），与 osu! 默认 HyperDashFruit 一致
  MANIA:
    # 每个 KEYS_N 块：COLUMN_WIDTHS 为各列宽度；COLUMN_LINE_WIDTHS 为 keys+1 条边界线宽度；
    # HIT_POSITION 为 osu! stable 480 高坐标系中的判定线位置。
    KEYS_1:
      COLUMN_WIDTHS: [68] # 1 键各列宽度
      COLUMN_LINE_WIDTHS: [0, 0] # 左边界、右边界线宽度
      HIT_POSITION: 473 # 判定线位置（480 高坐标系）
    KEYS_2:
      COLUMN_WIDTHS: [68, 68] # 各列宽度
      COLUMN_LINE_WIDTHS: [0, 0, 0]
      HIT_POSITION: 473 # 判定线位置（480 高坐标系）
