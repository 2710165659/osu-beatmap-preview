        PAGE_MARGIN_RIGHT: 15 # 页面右边距
        PAGE_MARGIN_BOTTOM: 15 # 页面下边距
        PAGE_MARGIN_LEFT: 15 # 页面左边距
        INFO_MARGIN_TOP: 0 # 每列顶部信息区
