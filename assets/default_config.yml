skin:
  # 皮肤颜色均为 RGB/RGBA；MANIA 下的 KEYS_N 为对应键数的列布局。
  COMBO_COLORS: [[150, 230, 255], [255, 125, 177], [130, 255, 160]] # Standard 连击颜色，按顺序循环
  HIT_CIRCLE_OVERLAP: 10 # Standard 圆圈重叠像素数
  HYPER_DASH: [255, 82, 139] # Hyper dash 提示颜色（RGB）
  MANIA:
    # 每个 KEYS_N 块：COLUMN_WIDTHS 为各列宽度；COLUMN_LINE_WIDTHS 为 keys+1 条边界线宽度；
    # COLUMN_COLORS 为各列背景色；HIT_POSITION 为 osu! stable 480 高坐标系中的判定线位置。
    KEYS_1:
      COLUMN_WIDTHS: [68] # 1 键各列宽度
      COLUMN_LINE_WIDTHS: [0, 0] # 左边界、右边界线宽度
      COLUMN_COLORS: [[0, 0, 0, 255]] # 各列背景色（RGBA）
      HIT_POSITION: 473 # 判定线位置（480 高坐标系）
    KEYS_2:
      COLUMN_WIDTHS: [68, 68] # 各列宽度
      COLUMN_LINE_WIDTHS: [0, 0, 0]
      COLUMN_COLORS: [[0, 0, 0, 255], [0, 0, 0, 255]]
      HIT_POSITION: 473 # 判定线位置（480 高坐标系）
    KEYS_3:
      COLUMN_WIDTHS: [68, 68, 68] # 各列宽度
      COLUMN_LINE_WIDTHS: [0, 0, 0, 0]
      COLUMN_COLORS: [[0, 0, 0, 255], [0, 0, 0, 255], [0, 0, 0, 255]]
      HIT_POSITION: 473 # 判定线位置（480 高坐标系）
    KEYS_4:
      COLUMN_WIDTHS: [68, 68, 68, 68] # 各列宽度
      COLUMN_LINE_WIDTHS: [0, 0, 0, 0, 0]
      COLUMN_COLORS:
        [[0, 0, 0, 255], [0, 0, 0, 255], [0, 0, 0, 255], [0, 0, 0, 255]]
      HIT_POSITION: 473 # 判定线位置（480 高坐标系）
    KEYS_5:
      COLUMN_WIDTHS: [60, 60, 60, 60, 60]
      COLUMN_LINE_WIDTHS: [0, 0, 0, 0, 0, 0]
