# 默认配置文件
# 通用约定：尺寸、边距、间距和字号均以像素为单位；名称含 _MS 的时长以毫秒为单位。
# 颜色为 [R, G, B, A]（或无透明通道的 [R, G, B]），各通道取值范围为 0～255。
paths:
  OUTPUT_DIR: "%TEMP%/osu-beatmap-preview/outputs" # 渲染结果输出目录
  CACHE_DIR: "%TEMP%/osu-beatmap-preview" # 下载内容及中间文件的缓存目录
  CONFIG_DIR: "./" # 外部 config.yml 的查找目录，相对路径以当前工作目录为基准
  LOG_DIR: "%TEMP%/osu-beatmap-preview/logs" # 日志文件目录
logging:
  config:
    PROGRESS_FILE: "progress.log" # 下载和处理进度日志文件名
    RENDER_FILE: "render.log" # 渲染日志文件名
network:
  downloader_cf_ip:
    CACHE_FILE: "osu-direct-preferred-ip.json" # 优选下载 IP 的缓存文件名
    LOCK_FILE: "osu-direct-preferred-ip.json.lock" # 更新优选 IP 缓存时使用的锁文件名
  downloader_osz:
    MAX_OSZ_BYTES: 52428800 # osz 文件下载的最大字节数，超过该值将被拒绝下载
    PARALLEL_PARTS: 4 # osz 文件下载的并行分块数
    USER_AGENT: "osu-beatmap-preview/1.0" # 下载请求使用的 HTTP User-Agent
    MAX_ACTIVE_ATTEMPTS: 3 # 同一下载任务允许同时进行的最大尝试数
    DOWNLOAD_HARD_TIMEOUT: 120 # 单次完整下载的硬超时，单位秒
timeouts:
  render:
    PNG_TIMEOUT: 300 # PNG 渲染超时，单位秒，必须大于 0
    GIF_TIMEOUT: 300 # GIF 渲染超时，单位秒，必须大于 0
    MP4_TIMEOUT: 300 # MP4 渲染超时，单位秒，必须大于 0
# 四模式布局设置
layout:
  standard:
    png:
      MS_PER_IMAGE: 400 # 同一行相邻图片之间的时间间隔，单位毫秒
      ROW_COUNT: 5 # 行数
      IMAGES_PER_ROW: 8 # 每行图片数
      HORIZONTAL_PAGE_MARGIN: 20 # 页面左右边距
      VERTICAL_PAGE_MARGIN: 20 # 页面上下边距
      INTRA_ROW_IMAGE_GAP: 20 # 同一行相邻图片之间的间距
      INTER_ROW_GAP: 100 # 不同行之间的间距
      CANVAS_BACKGROUND_COLOR: [0, 0, 0, 255] # 最终拼图画布的背景色
      IMAGE_BACKGROUND_COLOR: [0, 0, 0, 255] # 单张游玩区域截图的背景色
      TIME_LABEL_FONT_SIZE: 30 # 主时间标签字号
      TIME_LABEL_NOTE_FONT_SIZE: 22 # 时间标签附注字号
      TIME_LABEL_HEIGHT: 76 # 每张截图下方时间标签区域的高度
      TIME_LABEL_TOP_GAP: 8 # 主时间标签与截图的垂直间距
      TIME_LABEL_NOTE_TOP_GAP: 9 # 附注与主时间标签的垂直间距
      TIME_LABEL_COLOR: [232, 232, 232, 255] # 普通主时间标签颜色
      TIME_LABEL_NOTE_COLOR: [170, 170, 170, 255] # 时间标签附注颜色
      PREVIEW_TIME_LABEL_COLOR: [95, 221, 108, 255] # 预览时间点标签的强调色
      SLIDER_BODY_SUPERSAMPLE: 2 # 滑条本体的超采样倍数，越大越平滑但渲染越慢
    gif:
      ROW_COUNT: 2 # 动画画面的网格行数
      IMAGES_PER_ROW: 2 # 动画画面每行包含的游玩区域数
      SHOW_TIME_LABEL: true # 是否在每个游玩区域下方显示时间标签
      DURATION_MS: 5000 # 每个游玩区域覆盖的谱面时长
      FPS: 15 # GIF 帧率
      GRID_GAP: 20 # 网格单元之间的基础间距
      HORIZONTAL_PAGE_MARGIN: 20 # 画布左右边距
      VERTICAL_PAGE_MARGIN: 20 # 画布上下边距
      INTRA_ROW_IMAGE_GAP: 20 # 同一行相邻游玩区域的间距
      INTER_ROW_GAP: 100 # 相邻行之间的间距
      CANVAS_BACKGROUND_COLOR: [0, 0, 0, 255] # 最终 GIF 画布的背景色
      IMAGE_BACKGROUND_COLOR: [0, 0, 0, 255] # 单个游玩区域的背景色
      TIME_LABEL_FONT_SIZE: 30 # 主时间标签字号
      TIME_LABEL_NOTE_FONT_SIZE: 22 # 时间标签附注字号
      TIME_LABEL_HEIGHT: 76 # 时间标签区域高度
