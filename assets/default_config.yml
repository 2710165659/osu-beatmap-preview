      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      sizing:
        LABEL_FONT_SIZE: 24 # 时间标签字号
        LABEL_PAD: 12 # 时间标签与画布边缘的内边距
      style:
