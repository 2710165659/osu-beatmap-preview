# Default configuration values. build.rs generates typed Rust constants from this YAML.
logging:
  config:
    PROGRESS_FILE: "progress.log"
    RENDER_FILE: "render.log"
  timestamp:
    LOCAL_FORMAT: '[year]-[month]-[day] [hour]:[minute]:[second].[subsecond digits:3]'
  writer:
    MAX_LINE_BYTES: 4096
network:
  downloader_cf_ip:
    CACHE_FILE: "osu-direct-preferred-ip.json"
    LOCK_FILE: "osu-direct-preferred-ip.json.lock"
    CACHE_TTL: 86400
    TCP_TIMEOUT: 1200
    HTTP_TIMEOUT: 2500
    HTTP_CANDIDATES: 8
    CLOUDFLARE_IPV4_RANGES: ["173.245.48.0/20", "103.21.244.0/22", "103.22.200.0/22", "103.31.4.0/22","141.101.64.0/18", "108.162.192.0/18", "190.93.240.0/20", "188.114.96.0/20","197.234.240.0/22", "198.41.128.0/17", "162.158.0.0/15", "104.16.0.0/12","172.64.0.0/17", "172.64.128.0/18", "172.64.192.0/19", "172.64.224.0/22","172.64.229.0/24", "172.64.230.0/23", "172.64.232.0/21", "172.64.240.0/21","172.64.248.0/21", "172.65.0.0/16", "172.66.0.0/16", "172.67.0.0/16","131.0.72.0/22",]
  downloader_osz:
    MIB_BYTES: 1048576
    MAX_OSZ_BYTES: 52428800
    PARALLEL_PARTS: 4
    USER_AGENT: "osu-beatmap-preview/1.0"
    MAX_ACTIVE_ATTEMPTS: 3
    POLL_INTERVAL: 250
    NO_FIRST_BYTE_TIMEOUT: 3
    LOW_SPEED_WINDOW: 5
    LOW_SPEED_BYTES_PER_SECOND: 131072
    DOWNLOAD_HARD_TIMEOUT: 120
    CONNECT_TIMEOUT: 10
    READ_TIMEOUT: 15
    WRITE_TIMEOUT: 10
    BUFFER_SIZE: 65536
