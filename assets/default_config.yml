# 默认配置文件
# 通用约定：sizing 中的数字使用逻辑像素并受 SCALE 影响；structure 和 style 不缩放。
# 名称含 _MS 的时长以毫秒为单位；颜色为 [R, G, B, A]，通道范围为 0～255。
paths:
  # ----- 目录配置 -----
  OUTPUT_DIR: "%TEMP%/osu-beatmap-preview/outputs" # 渲染结果输出目录
  CACHE_DIR: "%TEMP%/osu-beatmap-preview" # 缓存根目录（存放 osz、osu 及 IP 缓存）
  CONFIG_DIR: "./" # 外部 config.yml 查找目录
  LOG_DIR: "%TEMP%/osu-beatmap-preview/logs" # 日志根目录
  # ----- 缓存类文件（位于 CACHE_DIR 下） -----
  PREFERRED_IP_CACHE: "osu-direct-preferred-ip.json" # 优选下载 IP 的缓存文件
  PREFERRED_IP_LOCK: "osu-direct-preferred-ip.json.lock" # 更新优选 IP 缓存时使用的锁文件
  # ----- 日志类文件（位于 LOG_DIR 下） -----
  PROGRESS_LOG: "progress.log" # 下载和处理进度日志
  RENDER_LOG: "render.log" # 渲染日志
download:
  osz:
    MAX_OSZ_BYTES: 52428800 # osz 文件下载的最大字节数，超过该值将被拒绝下载
    PARALLEL_PARTS: 4 # osz 文件下载的并行分块数
    USER_AGENT: "osu-beatmap-preview/1.0" # 下载请求使用的 HTTP User-Agent
    MAX_ACTIVE_ATTEMPTS: 3 # 同一下载任务允许同时进行的最大尝试数
    DOWNLOAD_HARD_TIMEOUT: 120 # 单次完整下载的硬超时，单位秒
timeout:
  PNG_TIMEOUT: 300 # PNG 渲染超时，单位秒，必须大于 0
  GIF_TIMEOUT: 300 # GIF 渲染超时，单位秒，必须大于 0
  MP4_TIMEOUT: 300 # MP4 渲染超时，单位秒，必须大于 0
advance:
  gif:
    PAR_CHUNK_SIZE: 8 # GIF 每批并行渲染的最大帧数
    MAX_PAR_FRAME_BYTES: 67108864 # GIF 并行帧允许占用的最大原始图像字节数
    PALETTE_COLORS: 127 # GIF 调色板中的不透明颜色数，另保留一个透明色索引
  video:
    PAR_CHUNK_SIZE: 8 # MP4 每批并行渲染的最大帧数
    MAX_PAR_FRAME_BYTES: 67108864 # MP4 并行帧允许占用的最大原始图像字节数
    VIDEO_BITRATE: 900000 # 硬件编码器目标视频码率，单位 bit/s
    VIDEO_END_PADDING_MS: 2000 # 最后一个物件后继续渲染的时长
    CPU_VIDEO_BITRATE: 500000 # CPU 编码器目标视频码率，单位 bit/s
  video_audio:
    AUDIO_SAMPLE_RATE: 48000 # 输出音频采样率，单位 Hz
    AUDIO_BITRATE: 96000 # 输出音频码率，单位 bit/s
    MAX_EXTRACTED_AUDIO_BYTES: 268435456 # 解码后音频允许占用的最大字节数
# 四模式渲染配置
render:
  standard:
    png:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      structure:
        ROW_COUNT: 5 # 行数
        IMAGES_PER_ROW: 8 # 每行图片数
      sizing:
        PAGE_MARGIN_TOP: 20 # 页面上边距
        PAGE_MARGIN_RIGHT: 20 # 页面右边距
        PAGE_MARGIN_BOTTOM: 20 # 页面下边距
        PAGE_MARGIN_LEFT: 20 # 页面左边距
        INFO_MARGIN_TOP: 0 # 单元顶部信息区
        INFO_MARGIN_RIGHT: 0 # 单元右侧信息区
        INFO_MARGIN_BOTTOM: 84 # 单元底部时间标签信息区
        INFO_MARGIN_LEFT: 0 # 单元左侧信息区
        COLUMN_GAP: 20 # 同一行相邻单元之间的纯空白
        ROW_GAP: 100 # 相邻行之间的纯空白
        TIME_LABEL_FONT_SIZE: 30 # 主时间标签字号
        TIME_LABEL_NOTE_FONT_SIZE: 22 # 时间标签附注字号
        TIME_LABEL_TOP_GAP: 8 # 主时间标签与截图的垂直间距
        TIME_LABEL_NOTE_TOP_GAP: 9 # 附注与主时间标签的垂直间距
      style:
        MS_PER_IMAGE: 400 # 同一行相邻图片之间的时间间隔，单位毫秒
        CANVAS_BACKGROUND_COLOR: [0, 0, 0, 255] # 最终拼图画布的背景色
        IMAGE_BACKGROUND_COLOR: [0, 0, 0, 255] # 单张游玩区域截图的背景色
        TIME_LABEL_COLOR: [232, 232, 232, 255] # 普通主时间标签颜色
        TIME_LABEL_NOTE_COLOR: [170, 170, 170, 255] # 时间标签附注颜色
        PREVIEW_TIME_LABEL_COLOR: [95, 221, 108, 255] # 预览时间点标签的强调色
        SLIDER_BODY_SUPERSAMPLE: 2 # 滑条本体的超采样倍数，越大越平滑但渲染越慢
    gif:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      structure:
        ROW_COUNT: 2 # 动画画面的网格行数
        IMAGES_PER_ROW: 2 # 动画画面每行包含的游玩区域数
      sizing:
        GRID_GAP: 20 # 网格单元之间的基础间距
        PAGE_MARGIN_TOP: 20 # 画布上边距
        PAGE_MARGIN_RIGHT: 20 # 画布右边距
        PAGE_MARGIN_BOTTOM: 20 # 画布下边距
        PAGE_MARGIN_LEFT: 20 # 画布左边距
        INFO_MARGIN_TOP: 0 # 网格顶部信息区
        INFO_MARGIN_RIGHT: 0 # 网格右侧信息区
        INFO_MARGIN_BOTTOM: 84 # 网格底部时间标签信息区
        INFO_MARGIN_LEFT: 0 # 网格左侧信息区
        TIME_LABEL_FONT_SIZE: 30 # 主时间标签字号
        TIME_LABEL_NOTE_FONT_SIZE: 22 # 时间标签附注字号
        TIME_LABEL_TOP_GAP: 8 # 主时间标签与游玩区域的垂直间距
        TIME_LABEL_NOTE_TOP_GAP: 9 # 附注与主时间标签的垂直间距
      style:
        SHOW_TIME_LABEL: true # 是否在每个游玩区域下方显示时间标签
        DURATION_MS: 5000 # 每个游玩区域覆盖的谱面时长
        FPS: 15 # GIF 帧率
        CANVAS_BACKGROUND_COLOR: [0, 0, 0, 255] # 最终 GIF 画布的背景色
        IMAGE_BACKGROUND_COLOR: [0, 0, 0, 255] # 单个游玩区域的背景色
        TIME_LABEL_COLOR: [232, 232, 232, 255] # 普通主时间标签颜色
        TIME_LABEL_NOTE_COLOR: [170, 170, 170, 255] # 时间标签附注颜色
        PREVIEW_TIME_LABEL_COLOR: [95, 221, 108, 255] # 预览时间点标签的强调色
        SLIDER_BODY_SUPERSAMPLE: 2 # 滑条本体的超采样倍数
    mp4:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      sizing:
        LABEL_FONT_SIZE: 24 # 时间标签字号
        LABEL_PAD: 12 # 时间标签与画布边缘的内边距
      style:
        FPS: 15 # MP4 帧率
        ENABLE_BACKGROUND_IMAGE: true # 是否启用谱面背景图
        BACKGROUND_DIM: 0.7 # 谱面背景图暗化程度
        LABEL_COLOR: [232, 232, 232, 255] # 右上角时间标签颜色（RGBA）
        BLACK_OPAQUE: [0, 0, 0, 255] # 视频合成使用的不透明黑色（RGBA）
        CANVAS_BACKGROUND_COLOR: [0, 0, 0, 255] # 最终视频画布的背景色
        IMAGE_BACKGROUND_COLOR: [0, 0, 0, 255] # 游玩区域背景色
  taiko:
    png:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      sizing:
        BASE_ROW_WIDTH_0_TO_1_MINUTES: 2600 # 0～1 分钟谱面使用的基础行宽
        BASE_ROW_WIDTH_1_TO_2_MINUTES: 3200 # 1～2 分钟谱面使用的基础行宽
        BASE_ROW_WIDTH_2_TO_3_MINUTES: 3800 # 2～3 分钟谱面使用的基础行宽
        BASE_ROW_WIDTH_3_TO_4_MINUTES: 4400 # 3～4 分钟谱面使用的基础行宽
        BASE_ROW_WIDTH_4_TO_5_MINUTES: 5000 # 4～5 分钟谱面使用的基础行宽
        BASE_ROW_WIDTH_5_TO_6_MINUTES: 5600 # 5～6 分钟谱面使用的基础行宽
        BASE_ROW_WIDTH_6_TO_10_MINUTES: 6400 # 6～10 分钟谱面使用的基础行宽
        ROW_GAP: 6 # 相邻轨道行之间的纯空白
        ROW_HEIGHT: 100 # 单行 playfield 高度
        ROW_INNER_PADDING_X: 33 # 轨道内容左右内边距
        PAGE_MARGIN_TOP: 8 # 页面上边距
        PAGE_MARGIN_RIGHT: 8 # 页面右边距
        PAGE_MARGIN_BOTTOM: 8 # 页面下边距
        PAGE_MARGIN_LEFT: 8 # 页面左边距
        INFO_MARGIN_TOP: 8 # 每行顶部 SV 信息区
        INFO_MARGIN_RIGHT: 0 # 每行右侧信息区
        INFO_MARGIN_BOTTOM: 66 # 每行底部时间、附注和 BPM 信息区
        INFO_MARGIN_LEFT: 0 # 每行左侧信息区
        LABEL_RIGHT_PADDING: 1 # 行末标签右侧内边距
        TIME_LABEL_FONT_SIZE: 24 # 时间标签字号
        TIME_LABEL_NOTE_FONT_SIZE: 17 # 时间标签附注字号
        BPM_FONT_SIZE: 22 # BPM 标签字号
        TIME_LABEL_TOP_GAP: 0 # 时间标签与轨道的垂直间距
        TIME_LABEL_NOTE_TOP_GAP: 5 # 附注与时间标签的垂直间距
        BPM_TOP_GAP: 5 # BPM 标签与上方内容的垂直间距
        SV_TEXT_FONT_SIZE: 15 # SV 文本字号
        SV_TOP_GAP: 0 # SV 文本与轨道顶部的间距
      style:
        MAX_SUPPORTED_DURATION_MS: 600000 # 支持的谱面最大时长
        ROW_WIDTH_MULTIPLIER_BPM_0_TO_180: 1.0 # BPM 0～180 时的行宽倍率
        ROW_WIDTH_MULTIPLIER_BPM_180_TO_240: 1.15 # BPM 180～240 时的行宽倍率
        ROW_WIDTH_MULTIPLIER_BPM_240_TO_300: 1.3 # BPM 240～300 时的行宽倍率
        ROW_WIDTH_MULTIPLIER_BPM_300_PLUS: 1.45 # BPM 300 以上时的行宽倍率
        SPACING_PER_BPM: 0.0 # 按 BPM 额外增加的水平间距，0 表示禁用
        TIME_LABEL_MIN_INTERVAL_MS: 2000 # 时间标签的最小时间间隔
        SV_TEXT_COLOR: [255, 217, 102, 255] # SV 文本颜色（RGBA）
        IMAGE_BACKGROUND: [0, 0, 0, 255] # 图片背景色（RGBA）
        BEAT_LINE_COLOR: [83, 83, 83, 255] # 拍线颜色（RGBA）
        RULER_TEXT_COLOR: [232, 232, 232, 255] # 标尺文本颜色（RGBA）
        ACCENT_LABEL_COLOR: [95, 221, 108, 255] # 强调标签颜色（RGBA）
        MEASURE_LINE_COLOR: [255, 255, 255, 170] # 小节线颜色（RGBA）
        TRACK_BACKGROUND_COLOR: [55, 55, 55, 255] # 轨道背景色（RGBA）
        TRACK_EDGE_COLOR: [80, 80, 80, 255] # 轨道边缘颜色（RGBA）
        TRACK_ACCENT_COLOR: [254, 59, 1, 255] # 轨道强调色（RGBA）
    gif:
      SCALE: 1.0 # 输出缩放倍率，在绘制前作用于全部像素尺寸
      structure:
        ROW_COUNT: 4 # 同时显示的轨道行数
      sizing:
        ROW_GAP: 7 # 动画中轨道行之间的纯空白
        PAGE_MARGIN_TOP: 8 # 画布上边距
        PAGE_MARGIN_RIGHT: 8 # 画布右边距
        PAGE_MARGIN_BOTTOM: 8 # 画布下边距
        PAGE_MARGIN_LEFT: 8 # 画布左边距
        INFO_MARGIN_TOP: 0 # 每行顶部信息区
        INFO_MARGIN_RIGHT: 0 # 每行右侧信息区
        INFO_MARGIN_BOTTOM: 33 # 每行底部时间标签信息区
        INFO_MARGIN_LEFT: 0 # 每行左侧信息区
        TIME_LABEL_FONT_SIZE: 20 # 时间标签字号
        TIME_LABEL_NOTE_FONT_SIZE: 14 # 时间标签附注字号
      style:
        IMAGE_BACKGROUND: [0, 0, 0, 255] # 图片背景色（RGBA）
        TRACK_BACKGROUND_COLOR: [55, 55, 55, 255] # 轨道背景色（RGBA）
        TRACK_EDGE_COLOR: [80, 80, 80, 255] # 轨道边缘颜色（RGBA）
        TRACK_ACCENT_COLOR: [254, 59, 1, 255] # 轨道强调色（RGBA）
        SHOW_TIME_LABEL: true # 是否显示时间标签
        SHOW_MEASURE_LINES: true # 是否绘制随谱面滚动的小节线
        DURATION_MS: 5000.0 # 每个动画片段覆盖的谱面时长
        FPS: 15.0 # GIF 帧率
        TIME_LABEL_COLOR: [232, 232, 232, 255] # 时间标签颜色（RGBA）
        TIME_LABEL_NOTE_COLOR: [170, 170, 170, 255] # 附注颜色（RGBA）
        PREVIEW_TIME_LABEL_COLOR: [95, 221, 108, 255] # 预览时间点标签颜色（RGBA）
        JUDGEMENT_LINE_COLOR: [255, 255, 255, 255] # 判定线颜色（RGBA）
