[package]
name = "osu-beatmap-preview-renderer"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
osu-beatmap-preview-core = { path = "../osu-beatmap-preview-core" }
# webgpu 特性提供 wasm 侧的 `ExternalImageSource`（背景视频帧 GPU 直拷）。
wgpu = { version = "29", features = ["webgpu"] }
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
pollster = "0.4"

