[package]
name = "osu-beatmap-preview-cli"
version = "1.2.0"
edition = "2021"
publish = false
build = "build.rs"

[build-dependencies]
vergen = { version = "9", features = ["build"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dependencies]
osu-beatmap-preview-core = { path = "../osu-beatmap-preview-core" }
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
ureq = "2"
sha2 = "0.10"
time = { version = "0.3", default-features = false, features = ["formatting", "local-offset", "macros"] }
gif = "0.13"
color_quant = "1.1"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1"
font8x8 = "0.3"
openh264 = "0.9"
mp4 = "0.14"
bytes = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm"] }
fdk-aac = "0.8"
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
nvenc = "0.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
