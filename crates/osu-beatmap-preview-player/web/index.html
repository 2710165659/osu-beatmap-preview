<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>osu! Beatmap Preview</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="app">
  <section id="load-page" class="page load-page"><div class="brand"><span>o!</span><div><small>LOCAL RENDER ENGINE</small><h1>谱面预览</h1></div></div>
    <form id="load-form"><label>谱面 BID<input id="bid" required placeholder="例如 738063"></label><label>转谱<select id="convert"><option value="">原模式</option><option>standard</option><option>taiko</option><option>catch</option><option>mania</option></select></label><button>加载预览</button></form><pre id="load-log"></pre></section>
  <section id="play-page" class="page play-page" hidden><header><button id="back">返回加载</button><strong id="mode">READY</strong><span id="status"></span></header><div class="viewport"><canvas id="canvas"></canvas><div id="empty">等待渲染</div></div><div class="controls"><div id="mod-controls" class="mod-controls" aria-label="实时 Mod"></div><div class="timeline"><span id="current">00:00</span><input id="seek" type="range" min="0" max="1" value="0"><span id="total">00:00</span></div><div class="buttons"><button id="play">播放</button><button id="minus">-5 秒</button><button id="plus">+5 秒</button><label>速度<select id="speed"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.5</option><option>2</option></select>x</label></div><pre id="play-log"></pre></div><audio id="audio" preload="auto"></audio></section>
</main><script src="/app.js"></script></body></html>
